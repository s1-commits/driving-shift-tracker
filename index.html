<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Shift Tracker - Track Your Earnings & Performance</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🚗 Driving Shift Tracker</h1>
                <p class="subtitle">Track earnings, optimize performance</p>
            </div>
            <button id="themeToggle" class="theme-toggle" title="Toggle theme">🌙</button>
        </header>

        <!-- Main Dashboard -->
        <div class="dashboard">
            <!-- Statistics Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Earnings</div>
                    <div class="stat-value" id="totalEarnings">$0.00</div>
                    <div class="stat-subtext">Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Hourly Rate</div>
                    <div class="stat-value" id="hourlyRate">$0.00</div>
                    <div class="stat-subtext">Average</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Time</div>
                    <div class="stat-value" id="activeTime">0h 0m</div>
                    <div class="stat-subtext">Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Trips Count</div>
                    <div class="stat-value" id="tripsCount">0</div>
                    <div class="stat-subtext">Completed</div>
                </div>
            </div>

            <!-- Activity Tracking Section -->
            <section class="section">
                <h2>📊 Current Activity</h2>
                <div class="activity-buttons">
                    <button class="activity-btn hunting-btn" id="huntingBtn" data-activity="hunting">
                        <span class="activity-icon">🔍</span>
                        <span class="activity-name">Hunting</span>
                        <span class="activity-time" id="huntingTime">0m</span>
                    </button>
                    <button class="activity-btn pickup-btn" id="pickupBtn" data-activity="pickup">
                        <span class="activity-icon">👤</span>
                        <span class="activity-name">Pickup</span>
                        <span class="activity-time" id="pickupTime">0m</span>
                    </button>
                    <button class="activity-btn waiting-btn" id="waitingBtn" data-activity="waiting">
                        <span class="activity-icon">⏳</span>
                        <span class="activity-name">Waiting</span>
                        <span class="activity-time" id="waitingTime">0m</span>
                    </button>
                    <button class="activity-btn trip-btn" id="tripBtn" data-activity="trip">
                        <span class="activity-icon">🛣️</span>
                        <span class="activity-name">Trip</span>
                        <span class="activity-time" id="tripTime">0m</span>
                    </button>
                </div>
            </section>

            <!-- Earnings Input Section -->
            <section class="section">
                <h2>💰 Log Earnings</h2>
                <div class="earnings-form">
                    <div class="form-group">
                        <label for="tripEarnings">Trip Earnings ($)</label>
                        <input type="number" id="tripEarnings" placeholder="0.00" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label for="surgePricing">Surge Multiplier</label>
                        <div class="surge-controls">
                            <button class="surge-btn" data-multiplier="1">1x</button>
                            <button class="surge-btn" data-multiplier="1.5">1.5x</button>
                            <button class="surge-btn" data-multiplier="2">2x</button>
                            <button class="surge-btn" data-multiplier="2.5">2.5x</button>
                            <input type="number" id="surgePricing" placeholder="Custom" step="0.1" min="1">
                        </div>
                    </div>
                    <button id="logEarningsBtn" class="btn btn-primary">Log Earnings</button>
                </div>
            </section>

            <!-- Shift History -->
            <section class="section">
                <h2>📋 Shift History</h2>
                <div class="controls">
                    <button id="clearDataBtn" class="btn btn-secondary">Clear All Data</button>
                    <button id="exportDataBtn" class="btn btn-secondary">Export Data</button>
                </div>
                <div class="shift-history" id="shiftHistory">
                    <p class="empty-state">No activities logged yet. Start tracking your shift!</p>
                </div>
            </section>

            <!-- Activity Summary -->
            <section class="section">
                <h2>📈 Activity Summary</h2>
                <div class="summary-grid" id="summaryGrid">
                    <!-- Populated by JavaScript -->
                </div>
            </section>
        </div>
    </div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed:', err));
        }
    </script>

    <!-- Main Application Scripts -->
    <script src="js/db.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/tracker.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
